services:
  - type: web
    name: patrolpoint-v2
    env: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: patrolpoint-db
          property: internalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OVERPASS_API_URL
        value: https://overpass-api.de/api/interpreter
